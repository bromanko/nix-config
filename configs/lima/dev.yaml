vmType: "vz"
os: "Linux"
arch: "default"

images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.0.5/nixos-lima-v0.0.5-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha256:c66e6fbc3c529c90cb72c8bdb459db058478bb015f446ece284b77921c4f32ee"
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.0.5/nixos-lima-v0.0.5-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha256:2bee23c26eb9a47db5b41386018c186e29464ab941455e68d50c67e726b7afd4"

user:
  # Match the NixOS host config, which forces /home/<user>.linux for Lima.
  home: "/home/{{.User}}.linux"

cpus: 4
memory: "12GiB"
disk: "100GiB"

# No host mounts — full isolation between host and guest.
# Code is cloned independently inside the VM.
mounts: []

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      export PATH="/run/current-system/sw/bin:/run/wrappers/bin:$PATH"

      retry() {
        local attempt=1
        local max_attempts=30
        local delay=2

        until "$@"; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "Command failed after $max_attempts attempts: $*" >&2
            return 1
          fi
          echo "Command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
          attempt=$((attempt + 1))
          sleep "$delay"
        done
      }

      # Clone nix-config if not already present. DNS can come up a few seconds
      # after SSH, so retry instead of silently leaving the VM unconfigured.
      if [ ! -d /etc/nixos/nix-config ]; then
        retry git clone https://github.com/bromanko/nix-config.git /etc/nixos/nix-config
      fi

      # Rebuild with the NixOS flake configuration
      cd /etc/nixos/nix-config
      retry nixos-rebuild switch --flake .#lima-dev --option max-jobs 1 --option cores 2

  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      export PATH="/run/current-system/sw/bin:/run/wrappers/bin:$PATH"

      retry() {
        local attempt=1
        local max_attempts=30
        local delay=2

        until "$@"; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "Command failed after $max_attempts attempts: $*" >&2
            return 1
          fi
          echo "Command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
          attempt=$((attempt + 1))
          sleep "$delay"
        done
      }

      # Set up user Code directory with nix-config clone
      mkdir -p ~/Code
      if [ ! -d ~/Code/nix-config ]; then
        retry git clone https://github.com/bromanko/nix-config.git ~/Code/nix-config
      fi

      echo "NixOS lima-dev setup complete"
      echo "Rebuild with: sudo nixos-rebuild switch --flake ~/Code/nix-config#lima-dev"

portForwards:
  # Exclude the secret-proxy port — the SSH reverse tunnel in the guest
  # listens on this port and Lima's automatic forwarding would steal the
  # host-side port from mitmdump. The reverse tunnel already handles the
  # guest→host forwarding for this port.
  - guestPort: 17329
    ignore: true
  - guestPortRange: [1024, 65535]
    hostPortRange: [1024, 65535]

ssh:
  loadDotSSHPubKeys: true
  forwardAgent: true
